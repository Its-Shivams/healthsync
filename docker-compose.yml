version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: healthsync-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=healthsync-production-secret-change-in-prod
      - JWT_REFRESH_SECRET=healthsync-production-refresh-secret
      - DATABASE_URL=file:./dev.db
      - CORS_ORIGIN=*
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000
    container_name: healthsync-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000
